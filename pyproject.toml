[project]
name = "docsplitter"
version = "0.1.0"
description = "Intelligent multi-document PDF splitter using vision AI"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "openai>=1.30",
    "pypdfium2>=4.30",
    "watchdog>=4.0",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "pyyaml>=6.0",
    "python-multipart>=0.0.9",
    "pillow>=10.3",
    "pytesseract>=0.3",
    "httpx>=0.27",
    "anyio>=4.3",
    "tenacity>=8.3",
    "python-dotenv>=1.0",
    "greenlet>=3.3.2",
    "aiofiles>=25.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx",
    "ruff>=0.4",
    "mypy>=1.10",
    "asgi-lifespan>=2.1.0",
]

[project.scripts]
docsplitter = "docsplitter.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
